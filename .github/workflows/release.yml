name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write # publish the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build and package
        run: |
          corepack enable
          ./package.sh

      - name: Checksum
        working-directory: out
        run: sha256sum gaugeshift.zip > SHA256SUMS

      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/gaugeshift.zip

      - name: Write release notes
        run: |
          {
            awk -v v="${GITHUB_REF_NAME#v}" '
              /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Verifying this download"
            echo
            echo "This zip was built by GitHub Actions from the source code of this release. To check:"
            echo
            echo '```sh'
            echo "gh attestation verify gaugeshift.zip --repo $GITHUB_REPOSITORY"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > out/NOTES.md
          cat out/NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/gaugeshift.zip out/SHA256SUMS \
            --title "Gaugeshift $GITHUB_REF_NAME" \
            --notes-file out/NOTES.md
