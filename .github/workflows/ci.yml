name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types, format, tests, build, safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Use the pnpm version pinned in package.json
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Tests, including randomized stress tests (with coverage minimums)
        run: pnpm coverage
      - run: pnpm build
      - name: Safety check (no root, network, subprocesses or runtime code loading)
        run: python3 scripts/check_safety.py
      - name: Known vulnerabilities in dependencies
        run: pnpm audit

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Decky Loader currently runs plugins on Python 3.14.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pytest-cov ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q tests/backend --cov=main --cov-report=term-missing --cov-fail-under=95

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
